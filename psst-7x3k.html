<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Psst</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
   <div class="sky" aria-hidden="true">
  <img class="cloud-img" src="bilder/wolke1.png" alt="" style="top:6%;  --w:240px; animation-duration:55s">
  <img class="cloud-img" src="bilder/wolke3.png" alt="" style="top:20%; --w:300px; animation-duration:65s; animation-delay:-20s">
  <img class="cloud-img" src="bilder/wolke4.png" alt="" style="top:32%; --w:180px; animation-duration:90s; animation-delay:-60s">
</div>
  <header class="hero">
    <h1>Psst …</h1>
    <div class="card">
      <p>Willkommen zum Geheimprojekt: KaWo.</p>
      <p>Ein kleiner Geheimtipp für den besonders neugierigen um bei der großen Party auch alles zu sehen ;)</p>
    </div>
    <div class="card" id="v-box" hidden>
  <h2>Du bist nicht alleine</h2>
  <p id="v-text"></p>
  <p id="v-owner" hidden></p>
</div>
    <a class="btn back" href="index.html">← Zurück zur Einladung</a>
  </header>

<script>
const ENDPOINT = "https://script.google.com/macros/s/AKfycbxipv8aLH9YeVD63zwDh5lEEYas-JSyRevGlPdUvWEPDdNP2iIsR-RpSMEWXqQmkcQ/exec";

(async () => {
  const q = new URLSearchParams(location.search);
  const box = document.getElementById("v-box");
  const text = document.getElementById("v-text");
  const ownerLine = document.getElementById("v-owner");
  let owner = false, id = "";
  try {
    if (q.get("owner") === "aus") localStorage.removeItem("owner");
    else if (q.has("owner")) localStorage.setItem("owner", "1");
    owner = localStorage.getItem("owner") === "1";
    id = localStorage.getItem("gid") || "";
  } catch (e) {}
  if (!id) {
    id = Array.from(crypto.getRandomValues(new Uint8Array(10)),
                    b => b.toString(16).padStart(2, "0")).join("");
    try { localStorage.setItem("gid", id); } catch (e) {}
  }

  try {
    if (ENDPOINT.startsWith("HIER")) throw new Error("ENDPOINT ist noch nicht eingetragen");
    // Deine eigenen Aufrufe werden nur angezeigt, nicht mitgezählt
    const r = await fetch(`${ENDPOINT}?action=${owner ? "stats" : "visit"}&id=${id}`);
    const s = await r.json();
    const n = Number(s.unique) || 0;

    text.innerHTML = n <= 1
      ? "Du bist der/die Erste, der/die diese Seite gefunden hat. ✨"
      : `Bisher waren <strong>${n}</strong> verschiedene Leute hier.`;
    box.hidden = false;

    if (owner) {
      ownerLine.textContent = `Nur für dich sichtbar: ${Number(s.total) || 0} Aufrufe insgesamt.`;
      ownerLine.hidden = false;
    }
  } catch (e) {
    // Gäste sehen bei einem Fehler nichts, nur du bekommst die Meldung
    if (owner) {
      text.textContent = "Zähler konnte nicht geladen werden: " + e.message;
      box.hidden = false;
    }
  }
})();
</script>
</body>
</html>
